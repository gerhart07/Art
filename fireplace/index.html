<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fireplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* A tall fireplace for a TV in portrait. It plays the clips listed in clips.txt.
   Remote: ◀ ▶ change the clip, OK starts the sound, hold OK for settings. */
:root {
  --wall: #000;
  --ink: #f3efe8;
  --ink-soft: rgba(243,239,232,.74);
  --ink-faint: rgba(243,239,232,.45);
  --panel: rgba(20,14,11,.84);
  --accent: #e2b67a;
  --serif: "Newsreader", Georgia, serif;
  --label: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
html { overflow: scroll; scrollbar-width: none; scroll-behavior: auto; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
body { margin: 0; background: var(--wall); color: var(--ink); font-family: var(--label); }
#space { width: 300vw; height: 300vh; }
body.idle, body.idle * { cursor: none !important; }

#stage { position: fixed; left: 50%; top: 50%; width: 100vw; height: 100vh; transform: translate(-50%,-50%); overflow: hidden; background: #000; }
#stage.turn-left  { width: 100vh; height: 100vw; transform: translate(-50%,-50%) rotate(-90deg); }
#stage.turn-right { width: 100vh; height: 100vw; transform: translate(-50%,-50%) rotate(90deg); }
#stage video.clip { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.6s linear; background: #000; }
#stage video.clip.show { opacity: 1; }
#dip, #dim, #fade { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; background: #000; }
#dip { opacity: 0; transition: opacity .8s ease; }
#dip.on { opacity: .55; }
#dim { opacity: 0; transition: opacity 1.2s ease; }
#fade { opacity: 1; transition: opacity .8s ease; }
#fade.clear { opacity: 0; }

#focus { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; outline: none; -webkit-tap-highlight-color: transparent; }
#focus:focus { outline: none; box-shadow: none; }

#toast { position: absolute; left: 6%; right: 6%; top: 2.2%; display: flex; align-items: center; justify-content: center; gap: .8em; z-index: 7;
  font-size: clamp(14px, 2.6vmin, 34px); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(243,226,200,.82);
  text-shadow: 0 1px 6px rgba(0,0,0,.8); opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
#toast.show { opacity: 1; }
#toast small { font-size: .82em; opacity: .75; text-transform: none; letter-spacing: .02em; font-weight: 500; }

#hint { position: absolute; left: 8%; right: 8%; top: 9%; background: var(--panel); border-radius: 1.6vmin; padding: 3.4vmin 3.6vmin; text-align: center; z-index: 6; transition: opacity 1s; }
#hint.gone { opacity: 0; pointer-events: none; }
#hint h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 5.4vmin, 76px); margin: 0 0 2vmin; }
#hint p { font-size: clamp(14px, 2.3vmin, 32px); color: var(--ink-soft); margin: 1vmin 0; line-height: 1.45; }
#hint kbd { font-family: var(--label); color: var(--ink); border: 1px solid var(--ink-faint); border-radius: .6vmin; padding: 0 .6vmin; }

#menu { position: absolute; left: 12%; right: 12%; top: 50%; transform: translateY(-50%); z-index: 8; background: var(--panel); color: var(--ink);
  border-radius: 1.6vmin; font-size: clamp(16px, 2.6vmin, 36px); letter-spacing: .02em; padding: 1.1em 1.3em; display: none; box-shadow: 0 1.5vmin 5vmin rgba(0,0,0,.45); }
#menu.open { display: block; }
#menu .mh { font-family: var(--serif); font-size: 1.25em; text-align: center; margin-bottom: .6em; }
#menu .mi { padding: .38em 0 .38em 1.1em; position: relative; opacity: .55; }
#menu .mi.on { opacity: 1; color: var(--accent); }
#menu .mi.on::before { content: ''; position: absolute; left: 0; top: 50%; width: .4em; height: .4em; margin-top: -.2em; background: currentColor; border-radius: 50%; }
#menu .mf { font-size: .7em; color: var(--ink-faint); margin-top: 1em; text-align: center; }
</style>
</head>
<body>
<div id="space"></div>
<div id="stage">
  <video class="clip" id="va" muted playsinline preload="auto"></video>
  <div id="dip"></div>
  <div id="dim"></div>
  <div id="fade"></div>
  <div id="hint">
    <h1>Fireplace</h1>
    <p>Press <kbd>OK</kbd> to start the crackle and full screen.</p>
    <p><kbd>◀</kbd> <kbd>▶</kbd> change the clip</p>
    <p>Hold <kbd>OK</kbd> for settings. Use the TV's own volume buttons for loudness.</p>
  </div>
  <div id="focus" tabindex="0" aria-label="Fireplace"></div>
  <div id="menu"></div>
  <div id="toast"></div>
</div>
<script>
(function () {
'use strict';
var DIMS = [{ name: 'full', a: 0 }, { name: 'softer', a: .25 }, { name: 'low', a: .45 }, { name: 'night', a: .65 }];
var state = { clip: 0, crackle: true, music: false, dim: 0, rotate: 'none' };
try { var s = JSON.parse(localStorage.getItem('fireplace-clips') || '{}'); for (var k in s) state[k] = s[k]; } catch (e) {}
function save() { try { localStorage.setItem('fireplace-clips', JSON.stringify(state)); } catch (e) {} }

var dipEl = document.getElementById('dip'), stage = document.getElementById('stage'), dimEl = document.getElementById('dim'), fadeEl = document.getElementById('fade');
var fading = false;
var CLIPS = [], CRACKLE = '', MUSIC = '';

/* ---------- The clip list ---------- */
function parseList(txt) {
  txt.split(/\r?\n/).forEach(function (line) {
    line = line.trim();
    if (!line || line.charAt(0) === '#') return;
    var m = /^(crackle|music)\s*:\s*(.+)$/i.exec(line);
    if (m) { if (m[1].toLowerCase() === 'crackle') CRACKLE = m[2].trim(); else MUSIC = m[2].trim(); return; }
    var parts = line.split('|'), src = parts[0].trim();
    var name = parts[1] && parts[1].trim() ? parts[1].trim() : src.split('/').pop().replace(/\.[a-z0-9]+$/i, '').replace(/[-_]+/g, ' ');
    var tags = (parts[2] || '').toLowerCase().split(/[\s,]+/).filter(Boolean);
    CLIPS.push({ src: src, name: name, tags: tags });
  });
}

/* ---------- Choosing a clip for today: season, holiday, weather, time of day ----------
   A clip tagged for another season or holiday waits for its time. Untagged clips fit any day. */
var SEASONS = ['winter', 'spring', 'summer', 'fall'], HOLIDAYS = ['christmas', 'newyear', 'thanksgiving', 'halloween', 'valentines', 'july4'];
var WEATHERS = ['clear', 'cloudy', 'fog', 'rain', 'snow'], wx = null;
function today() {
  var d = new Date(), m = d.getMonth() + 1, day = d.getDate(), h = d.getHours(), hol = null;
  var thanks = 22 + (11 - new Date(d.getFullYear(), 10, 1).getDay()) % 7; /* fourth Thursday of November */
  if ((m === 12 && day >= 31) || (m === 1 && day === 1)) hol = 'newyear';
  else if ((m === 11 && day > thanks) || m === 12 || (m === 1 && day <= 6)) hol = 'christmas';
  else if (m === 11 && day >= thanks - 10) hol = 'thanksgiving';
  else if (m === 10 && day >= 15) hol = 'halloween';
  else if (m === 2 && day >= 7 && day <= 14) hol = 'valentines';
  else if ((m === 6 && day >= 28) || (m === 7 && day <= 5)) hol = 'july4';
  return { season: SEASONS[Math.floor((m % 12) / 3)], holiday: hol, weather: wx, time: h >= 7 && h < 18 ? 'day' : 'night' };
}
function fits(c, t) {
  var has = function (list) { return c.tags.filter(function (x) { return list.indexOf(x) >= 0; }); };
  var s = has(SEASONS), h = has(HOLIDAYS);
  if (s.length && s.indexOf(t.season) < 0) return -1;
  if (h.length && h.indexOf(t.holiday) < 0) return -1;
  var score = 1 + (h.length ? 4 : 0) + (s.length ? 2 : 0);
  if (t.weather && c.tags.indexOf(t.weather) >= 0) score += 3;
  if (c.tags.indexOf(t.time) >= 0) score += 1;
  return score;
}
function pickClip(avoid) {
  var t = today(), pool = [];
  CLIPS.forEach(function (c, i) { var sc = fits(c, t); if (sc > 0 && i !== avoid) pool.push({ i: i, w: sc * sc }); });
  if (!pool.length) CLIPS.forEach(function (c, i) { if (i !== avoid) pool.push({ i: i, w: 1 }); });
  if (!pool.length) return avoid;
  var total = pool.reduce(function (a, p) { return a + p.w; }, 0), r = Math.random() * total;
  for (var k = 0; k < pool.length; k++) { r -= pool[k].w; if (r <= 0) return pool[k].i; }
  return pool[pool.length - 1].i;
}
function updateWeather() {
  /* City-level only (Brea, California), the same as the art wall. Open-Meteo needs no key. */
  return fetch('https://api.open-meteo.com/v1/forecast?latitude=33.9&longitude=-117.9&current=weather_code').then(function (r) { return r.json(); })
    .then(function (j) {
      var c = j.current && j.current.weather_code;
      wx = c == null ? null : c <= 1 ? 'clear' : c <= 3 ? 'cloudy' : c <= 48 ? 'fog' : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'snow' : 'rain';
    }).catch(function () {});
}

/* ---------- Video: one player. TVs often have a single video decoder, so only one clip loads at a time.
   At the end of a clip the picture dips softly toward dark and starts over. ---------- */
var vid = document.getElementById('va'), watchTimer = null;
function playSafe(v) { try { var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
function loadClip(i) {
  if (!CLIPS.length) return;
  state.clip = (i + CLIPS.length) % CLIPS.length; save();
  fading = false;
  vid.classList.remove('show');
  vid.loop = false; vid.src = CLIPS[state.clip].src; vid.load(); playSafe(vid);
  clearTimeout(watchTimer);
  watchTimer = setTimeout(function () { if (vid.readyState < 3 || vid.paused) report('still loading'); }, 9000);
}
function report(what) {
  /* Shows why a clip will not play, on screen, so it can be read off the TV. */
  var e = vid.error, codes = { 1: 'stopped', 2: 'network', 3: 'decode', 4: 'format not supported' };
  toast('Clip trouble: ' + (e ? codes[e.code] || 'code ' + e.code : what), 'ready ' + vid.readyState + ' · net ' + vid.networkState + ' · ' + (vid.videoWidth || '?') + 'x' + (vid.videoHeight || '?'));
  fadeEl.classList.add('clear');
}
vid.addEventListener('playing', function () { clearTimeout(watchTimer); vid.classList.add('show'); fadeEl.classList.add('clear'); dipEl.classList.remove('on'); });
vid.addEventListener('timeupdate', function () {
  if (!vid.duration || !isFinite(vid.duration) || fading) return;
  if (vid.currentTime >= vid.duration - .9) { fading = true; dipEl.classList.add('on'); }
});
vid.addEventListener('ended', function () {
  try { vid.currentTime = 0; } catch (e) {} playSafe(vid);
  setTimeout(function () { dipEl.classList.remove('on'); fading = false; }, 150);
});
vid.addEventListener('error', function () {
  if (!CLIPS.length) return;
  report('error');
  if (CLIPS.length > 1) setTimeout(function () { changeClip(1, true); }, 6000);
});
var ROTATE_MS = 10 * 60 * 1000, rotTimer = null;
function rotateSoon(ms) { clearTimeout(rotTimer); rotTimer = setTimeout(function () { if (menuOpen) return rotateSoon(5000); if (CLIPS.length > 1) goTo(pickClip(state.clip)); rotateSoon(); }, ms || ROTATE_MS); }
function goTo(i, quiet) {
  fadeEl.classList.remove('clear');
  setTimeout(function () { loadClip(i); if (!quiet) toast(CLIPS[state.clip].name); }, 1200);
}
function changeClip(d, quiet) {
  if (CLIPS.length < 2) { if (CLIPS.length) toast(CLIPS[state.clip].name, 'the only clip so far'); return; }
  goTo(state.clip + d, quiet);
  rotateSoon();
}

/* ---------- Sound: a real recorded crackle, looped with a soft overlap ---------- */
var RATE = .72, AC = null, crackleBuf = null, crackleGain = null, crackleTimer = null, nextAt = 0, paused = false, musicEl = null;
function initAudio() {
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  if (AC && CRACKLE) {
    crackleGain = AC.createGain(); crackleGain.gain.value = 0;
    /* Slowed a little and the hiss rolled off, so it reads as logs in a fireplace rather than a sizzle. */
    var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400; lp.Q.value = .5;
    var lp2 = AC.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 2600; lp2.Q.value = .5;
    crackleGain.connect(lp); lp.connect(lp2); lp2.connect(AC.destination);
    fetch(CRACKLE).then(function (r) { return r.arrayBuffer(); }).then(function (b) {
      return new Promise(function (ok, no) { AC.decodeAudioData(b, ok, no); });
    }).then(function (buf) { crackleBuf = buf; nextAt = AC.currentTime + .1; schedule(); setSound(); })
      .catch(function () { toast('The crackle did not load'); });
  }
  if (MUSIC) { musicEl = new Audio(MUSIC); musicEl.loop = true; musicEl.volume = .5; }
  setSound();
}
function schedule() {
  if (!crackleBuf) return;
  var X = Math.min(1.5, crackleBuf.duration / 4);
  while (nextAt < AC.currentTime + 4) {
    var src = AC.createBufferSource(), g = AC.createGain();
    src.buffer = crackleBuf; src.playbackRate.value = RATE; src.connect(g); g.connect(crackleGain);
    var t = nextAt, end = t + crackleBuf.duration / RATE;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + X);
    g.gain.setValueAtTime(1, end - X); g.gain.linearRampToValueAtTime(0, end);
    src.start(t); src.stop(end + .05);
    nextAt = end - X;
  }
  clearTimeout(crackleTimer); crackleTimer = setTimeout(schedule, 1000);
}
function setSound() {
  if (crackleGain) {
    var on = state.crackle && !paused ? 1.1 : 0;
    crackleGain.gain.cancelScheduledValues(AC.currentTime);
    crackleGain.gain.setTargetAtTime(on, AC.currentTime, .4);
  }
  if (musicEl) { if (state.music && !paused) playSafe(musicEl); else musicEl.pause(); }
}

/* ---------- Remote, full screen, feedback ---------- */
var toastEl = document.getElementById('toast'), toastTimer;
function toast(msg, sub) {
  toastEl.textContent = msg;
  if (sub) { var s = document.createElement('small'); s.textContent = sub; toastEl.appendChild(s); }
  toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1900);
}
function keepAwake() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} }
var started = false;
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { playSafe(vid); if (started) { keepAwake(); if (AC && AC.resume) AC.resume(); } }
});
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function fullScreen() {
  if (isFull()) return;
  var el = document.documentElement;
  try {
    var r = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null;
    if (r && r.catch) r.catch(function () {});
  } catch (e) {}
}
var focusEl = document.getElementById('focus');
function focusLayer() { try { focusEl.focus({ preventScroll: true }); } catch (e) { try { focusEl.focus(); } catch (e2) {} } }
function start() {
  if (started) return;
  started = true;
  focusLayer();
  document.getElementById('hint').classList.add('gone');
  fullScreen(); keepAwake(); initAudio(); centerScroll(); playSafe(vid);
}

/* ---------- Settings card: hold OK ---------- */
var menuEl = document.getElementById('menu'), menuOpen = false, menuSel = 0, menuTimer = null;
var ROT_NAMES = { none: 'upright', left: 'turned left', right: 'turned right' };
function setRotate() { stage.className = state.rotate === 'left' ? 'turn-left' : state.rotate === 'right' ? 'turn-right' : ''; }
function goArt() { closeMenu(); toast('Art wall'); setTimeout(function () { location.href = '../'; }, 300); }
function menuItems() {
  var items = [
    { t: 'Clip: ' + (CLIPS.length ? CLIPS[state.clip].name : 'none listed'), a: function () { changeClip(1); } },
    { t: 'Crackle: ' + (state.crackle ? 'on' : 'off'), a: function () { state.crackle = !state.crackle; save(); setSound(); } }
  ];
  if (MUSIC) items.push({ t: 'Music: ' + (state.music ? 'on' : 'off'), a: function () { state.music = !state.music; save(); setSound(); } });
  items.push(
    { t: 'Brightness: ' + DIMS[state.dim].name, a: function () { state.dim = (state.dim + 1) % DIMS.length; save(); dimEl.style.opacity = DIMS[state.dim].a; } },
    { t: paused ? 'Sound: paused' : 'Sound: on', a: function () { paused = !paused; setSound(); } },
    { t: 'Picture: ' + ROT_NAMES[state.rotate || 'none'], a: function () { state.rotate = state.rotate === 'none' ? 'left' : state.rotate === 'left' ? 'right' : 'none'; save(); setRotate(); } },
    { t: 'Go to the art wall', a: goArt },
    { t: 'Close', a: closeMenu }
  );
  return items;
}
function drawMenu() {
  menuEl.innerHTML = '';
  var h = document.createElement('div'); h.className = 'mh'; h.textContent = 'Settings'; menuEl.appendChild(h);
  menuItems().forEach(function (m, i) {
    var d = document.createElement('div'); d.className = 'mi' + (i === menuSel ? ' on' : ''); d.textContent = m.t;
    d.addEventListener('mouseenter', function () { if (menuSel !== i) { menuSel = i; drawMenu(); } });
    menuEl.appendChild(d);
  });
  var f = document.createElement('div'); f.className = 'mf'; f.textContent = '▲ ▼ choose · OK change · ◀ close'; menuEl.appendChild(f);
  menuTouch();
}
function menuTouch() { clearTimeout(menuTimer); menuTimer = setTimeout(closeMenu, 20000); }
function openMenu() { menuOpen = true; menuSel = 0; drawMenu(); menuEl.classList.add('open'); }
function closeMenu() { if (!menuOpen) return; menuOpen = false; menuEl.classList.remove('open'); clearTimeout(menuTimer); }
function menuMove(d) { var n = menuItems().length; menuSel = (menuSel + d + n) % n; drawMenu(); }
var lastDo = 0;
function menuDo() { if (Date.now() - lastDo < 350) return; lastDo = Date.now(); menuItems()[menuSel].a(); if (menuOpen) drawMenu(); }

var holdTimer = null, holdFired = false, enterDown = false;
function holdStart() { holdFired = false; clearTimeout(holdTimer); holdTimer = setTimeout(function () { holdFired = true; if (menuOpen) closeMenu(); else openMenu(); }, 800); }
function holdEnd() { clearTimeout(holdTimer); }
document.addEventListener('mousedown', function () { if (started) holdStart(); });
document.addEventListener('mouseup', holdEnd);
window.addEventListener('keyup', function (e) { if (e.key === 'Enter' || e.keyCode === 13) { enterDown = false; holdEnd(); } }, true);

window.addEventListener('keydown', function (e) {
  var k = e.key, c = e.keyCode;
  if (!started) { if (k === 'Enter' || k === ' ' || c === 13) { e.preventDefault(); start(); } return; }
  fullScreen();
  if (AC && AC.state === 'suspended' && AC.resume) AC.resume();
  var isEnter = k === 'Enter' || c === 13;
  if (menuOpen) {
    e.preventDefault(); menuTouch();
    if (k === 'ArrowUp' || c === 38) menuMove(-1);
    else if (k === 'ArrowDown' || c === 40) menuMove(1);
    else if (k === 'ArrowLeft' || c === 37 || k === 'Escape' || k === 'Backspace' || c === 10009) { if (!e.repeat) closeMenu(); }
    else if ((k === 'ArrowRight' || c === 39) && !e.repeat) menuDo();
    else if (isEnter && !e.repeat && !enterDown) { enterDown = true; holdStart(); menuDo(); }
    return;
  }
  if (isEnter) { e.preventDefault(); if (!enterDown) { enterDown = true; holdStart(); focusLayer(); } return; }
  if (k === 'ContextMenu' || k === 'Menu' || c === 18 || c === 10133 || c === 93) { e.preventDefault(); openMenu(); return; }
  if (e.repeat && (c === 37 || c === 39)) { e.preventDefault(); return; }
  if (k === 'ArrowRight' || c === 39) { e.preventDefault(); changeClip(1); }
  else if (k === 'ArrowLeft' || c === 37) { e.preventDefault(); changeClip(-1); }
  else if (k === 'ArrowUp' || c === 38 || k === 'ArrowDown' || c === 40) { e.preventDefault(); }
  else if (k === ' ' || k === 'MediaPlayPause' || k === 'MediaPlay' || k === 'MediaPause' || c === 10252 || c === 415 || c === 19 || c === 179) {
    e.preventDefault();
    paused = k === 'MediaPlay' || c === 415 ? false : k === 'MediaPause' || c === 19 ? true : !paused;
    setSound(); toast(paused ? 'Sound paused' : 'Sound on');
  }
}, true);
document.addEventListener('click', function () {
  if (!started) { start(); return; }
  if (holdFired) { holdFired = false; return; }
  if (menuOpen) { menuDo(); return; }
  if (!isFull()) fullScreen();
  if (AC && AC.state === 'suspended' && AC.resume) AC.resume();
  focusLayer();
});

/* Samsung's blue-circle mode scrolls the page with the arrows. Read each nudge as a command, then re-center. */
var scrollReady = false, scrollBusy = false;
function centerScroll() {
  scrollReady = false;
  window.scrollTo(window.innerWidth, window.innerHeight);
  setTimeout(function () { scrollReady = true; }, 200);
}
window.addEventListener('scroll', function () {
  if (!started || !scrollReady || scrollBusy) return;
  var dx = window.scrollX - window.innerWidth, dy = window.scrollY - window.innerHeight;
  if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
  scrollBusy = true;
  if (menuOpen) {
    menuTouch();
    if (Math.abs(dy) > Math.abs(dx)) menuMove(dy > 0 ? 1 : -1); else if (dx > 0) menuDo(); else closeMenu();
    setTimeout(function () { scrollBusy = false; centerScroll(); }, 400); return;
  }
  if (Math.abs(dx) >= Math.abs(dy)) changeClip(dx > 0 ? 1 : -1);
  setTimeout(function () { scrollBusy = false; centerScroll(); }, 900);
}, { passive: true });
window.addEventListener('resize', function () { if (started) centerScroll(); });
/* Samsung's Back button: stay on the page instead of leaving it. */
try { history.pushState({ fire: 1 }, ''); } catch (e) {}
window.addEventListener('popstate', function () {
  try { history.pushState({ fire: 1 }, ''); } catch (e) {}
  if (menuOpen) closeMenu(); else if (started) toast('Hold OK for settings');
});
var idleTimer;
document.addEventListener('mousemove', function () {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 4000);
});

setRotate();
dimEl.style.opacity = DIMS[state.dim] ? DIMS[state.dim].a : 0;
var wxReady = Promise.race([updateWeather(), new Promise(function (ok) { setTimeout(ok, 2500); })]);
setInterval(updateWeather, 30 * 60 * 1000);
fetch('clips.txt?t=' + Date.now()).then(function (r) { return r.text(); }).then(function (t) {
  parseList(t);
  if (!CLIPS.length) { fadeEl.classList.add('clear'); toast('No clips listed yet', 'add one to clips.txt'); return; }
  return wxReady.then(function () { loadClip(pickClip(-1)); rotateSoon(); });
}).catch(function () { fadeEl.classList.add('clear'); toast('Could not read clips.txt'); });
window.__fire = { today: today, weather: function () { return wx; }, state: state, clips: function () { return CLIPS; }, crackle: function () { return !!crackleBuf; }, video: function () { return vid; }, start: start, changeClip: changeClip };
})();
</script>
